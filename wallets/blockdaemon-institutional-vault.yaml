# Blockdaemon Institutional Vault — Canton Wallet Directory self-attestation.
# Product docs: https://vault.docs.blockdaemon.com/
# Overview: https://www.blockdaemon.com/blog/blockdaemon-expands-institutional-access-to-the-canton-network-with-institutional-vault-tm-2

name: "Blockdaemon Institutional Vault"
wallet-name: blockdaemon-institutional-vault
website: "https://www.blockdaemon.com/mpc-wallets-and-vaults/institutional-vault"
contact: "support@blockdaemon.com"
added: "2026-08-05"
# Required by CONTRIBUTING.md — confirm active membership in #ext-temp-party-scaling
# before opening the upstream PR.
slack_party_scaling_channel_joined: true

features:
  # Wallet Type
  wallet_model: [Enterprise]
  custody_model: Self-custodial
  form_factor: [Browser, Desktop, Mobile]
  deployment_model: [SaaS, Hybrid, On-prem]

  # Canton Coin
  cc_support:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#cc-support-cc_support
    verified_by: []
  two_step_cc_transfers:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#two-step-cc-transfers-two_step_cc_transfers
    verified_by: []
  preapprovals:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#pre-approvals-for-cc-preapprovals
    verified_by: []

  # Token Standard
  cip_0056_transfer:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#cip-0056-token-standard-transfer-support-cip_0056_transfer
    verified_by: []
  cip_0056_allocation:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#cip-0056-token-standard-allocation-support-cip_0056_allocation
    verified_by: []

  # Interoperability
  memo_tag_support:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#memo-tag-support-for-transfers-to-omnibus-accounts-memo_tag_support
    verified_by: []

  # dApp Connectivity (CIP-103)
  walletconnect_support:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#wallet-connect-support-walletconnect_support
    verified_by: []

  # App Specific
  wallet_gateway_signing_driver:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#wallet-gateway-signing-driver-wallet_gateway_signing_driver
    verified_by: []

  # Party Specific
  key_generation_method: "MPC/TSS Distributed Key Generation (Ed25519)"
  key_recovery:
    supported: true
  multi_address:
    supported: true

  # Validator Hosting
  validator_hosting_byov:
    supported: true
  validator_hosting_private:
    supported: true
  validator_hosting_shared:
    supported: true

  # Transaction Signing
  policy_workflows:
    supported: true
  threshold_signature_scheme:
    supported: true

  # Wallet Capabilities
  compliance:
    supported: true
  tokenization:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#tokenization-tokenization
    verified_by: []
  clear_signing:
    supported: true
    proof: proofs/blockdaemon-institutional-vault/blockdaemon-institutional-vault-self-attestation.md#clear-signing-clear_signing
    verified_by: []
  assets_supported: ["CC", "CIP-0056 utility tokens (DA Utilities and DTCC registry backends)"]
  languages_supported: ["English"]
