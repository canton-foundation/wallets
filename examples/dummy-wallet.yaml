# Dummy wallet example

name: "Dummy Wallet"
wallet-name: dummy-wallet
website: "https://example.com/dummy-wallet"
contact: "dummy-team@example.com"
added: "2026-06-10"
slack_party_scaling_channel_joined: true

features:
  # Wallet Type
  wallet_model: [retail, enterprise]
  custody_model: self-custodial
  form_factor: [browser, mobile]
  deployment_model: [saas, hybrid]

  # Canton Coin
  cc_support:
    supported: true
    proof: examples/dummy-wallet-self-attestation.md#cc-support-transfers-and-holding-cc_support
    verified_by:
      - by: ThirdParty
        date: "2026-06-05"
        result: verified
        proof: examples/dummy-wallet-third-party-attestation.md#cc-support-transfers-and-holding-cc_support-verified-by-thirdparty
  preapprovals:
    supported: true
    proof: examples/dummy-wallet-self-attestation.md#pre-approvals-for-cc-preapprovals
    verified_by: []

  # Token Standard
  cip_0056_transfer:
    supported: true
    proof: examples/dummy-wallet-self-attestation.md#cip-0056-token-standard-transfer-support-cip_0056_transfer
    verified_by: []
  cip_112_v2:
    supported: true
    proof: null
    verified_by: []

  # Interoperability
  cip_0103_dapp_api:
    supported: true
    proof: examples/dummy-wallet-self-attestation.md#cip-0103-dapp-api-support-cip_0103_dapp_api
    verified_by: []
  walletconnect_support:
    supported: false
    reason: "Not yet implemented; CIP-0103 is used today for dApp connections."
    proof: null
    verified_by: []
  memo_tag_support:
    supported: true
    proof: examples/dummy-wallet-self-attestation.md#memo-tag-support-for-transfers-to-exchanges-memo_tag_support
    verified_by: []

  # Network relevant features
  utxo_merge_delegation:
    supported: false
    proof: null
    verified_by: []

  # Party Specific
  key_recovery:
    supported: true

  # Transaction Signing
  hardware_wallet_support:
    supported: true
    proof: null
    verified_by: []

  # Wallet Capabilities
  clear_signing:
    supported: true
    proof: null
    verified_by: []
  assets_supported: ["CC", "USDC (CIP-0056)", "Example Token (CIP-0056)"]
  languages_supported: ["English", "German"]
